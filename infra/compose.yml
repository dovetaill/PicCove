services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: piccove
      POSTGRES_USER: piccove
      POSTGRES_PASSWORD: piccove_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piccove -d piccove"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
volumes:
  pgdata:
  redisdata:
