[package]
name = "piccove-api"
version = "0.1.9"
edition = "2021"
default-run = "piccove-api"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate"] }
argon2 = "0.5"
sha2 = "0.10"
fs2 = "0.4"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = { version = "=0.5.5", default-features = false }
totp-rs = { version = "=5.7.2", features = ["gen_secret", "otpauth"] }
# Keep the existing static musl release build independent of host OpenSSL.
openssl = { version = "0.10", features = ["vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
flate2 = "1"
tar = "0.4"
tempfile = "3"
libc = "0.2"
signal-hook = "0.3"
